<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>AR • VEICHI AC10 Series VFD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root {
            --panel: rgba(15, 23, 42, 0.85);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --muted: #94a3b8;
            --ac: #0ea5e9;
            --dc: #f97316;
            --pwm: #eab308;
            --air: #38bdf8;
            --ok: #10b981;
            --bad: #ef4444;
            --rad-lg: 20px;
            --rad-md: 14px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: "IBM Plex Sans Thai", sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* ภาพจากกล้องต้องอยู่ชั้น 0 เหนือพื้นหลังของหน้าเว็บ ฉาก 3 มิติชั้น 1 UI ชั้น 20 ขึ้นไป
           ห้ามใช้ z-index ติดลบ เพราะวิดีโอจะจมใต้พื้นหลังจนจอดำ */
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: 0 !important;
            display: block !important;
        }

        a-scene {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: transparent;
        }

        .a-canvas {
            background: transparent !important;
        }

        .arjs-loader {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #020617;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, .05);
            border-top-color: var(--ac);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .glass {
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
        }

        /* ---------------- HUD ---------------- */
        #hud-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            pointer-events: none;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .title-card {
            padding: 12px 18px;
            border-radius: var(--rad-lg);
            pointer-events: auto;
        }

        .title-card h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .title-card p {
            margin: 4px 0 0;
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
        }

        .status-pill {
            padding: 8px 14px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: auto;
            flex: none;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dc);
            box-shadow: 0 0 8px var(--dc);
            transition: .3s;
        }

        .found .dot {
            background: var(--ok);
            box-shadow: 0 0 10px var(--ok);
        }

        /* ---------------- Meter ---------------- */
        #meter {
            position: fixed;
            right: 16px;
            top: calc(96px + env(safe-area-inset-top, 0px));
            z-index: 20;
            padding: 16px;
            text-align: right;
            min-width: 140px;
            border-radius: var(--rad-lg);
            border-right: 4px solid var(--pwm);
        }

        #meter .big {
            font-family: "IBM Plex Mono", monospace;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            letter-spacing: -1px;
        }

        #meter .big small {
            font-size: 12px;
            color: var(--muted);
            font-family: "IBM Plex Sans Thai";
            margin-left: 4px;
            font-weight: 500;
        }

        #meter .sub {
            font-family: "IBM Plex Mono", monospace;
            font-size: 12px;
            color: var(--pwm);
            margin-top: 8px;
            font-weight: 600;
        }

        #meter.fault {
            border-right-color: var(--bad);
        }

        #meter.fault .big {
            color: var(--bad);
            animation: blink 1.2s infinite alternate;
            text-shadow: 0 0 15px rgba(239, 68, 68, .4);
        }

        @keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: .5;
            }
        }

        .heatbar {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, .1);
            margin-top: 12px;
            overflow: hidden;
        }

        .heatfill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--ac), var(--pwm), var(--bad));
            transition: width .3s;
        }

        /* ---------------- Toast ---------------- */
        #toast-error {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            left: 16px;
            right: 16px;
            z-index: 50;
            max-width: 420px;
            margin: 0 auto;
            padding: 18px;
            border-radius: var(--rad-lg);
            pointer-events: none;
            background: rgba(127, 29, 29, .95);
            border: 1px solid #f87171;
            box-shadow: 0 16px 40px rgba(185, 28, 28, .4);
            transform: translateY(-160%);
            transition: .4s cubic-bezier(.2, .8, .2, 1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        #toast-error.show {
            transform: translateY(0);
            pointer-events: auto;
        }

        .toast-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .toast-head b {
            font-family: "IBM Plex Mono";
            font-size: 14px;
            color: #991b1b;
            background: #fca5a5;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .toast-head span {
            font-weight: 700;
            color: #fff;
            font-size: 16px;
        }

        .toast-body {
            font-size: 13px;
            line-height: 1.6;
            color: #fecaca;
            margin-bottom: 14px;
        }

        /* ---------------- Bottom sheet ---------------- */
        #dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            pointer-events: none;
            padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dock-card {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border-radius: 28px;
            pointer-events: auto;
            transition: .4s cubic-bezier(.2, .8, .2, 1);
        }

        .drag-handle {
            width: 44px;
            height: 5px;
            background: rgba(255, 255, 255, .25);
            border-radius: 3px;
            margin: 0 auto 16px;
            cursor: pointer;
        }

        .step-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .step-num {
            background: rgba(14, 165, 233, .15);
            color: var(--ac);
            border: 1px solid rgba(14, 165, 233, .3);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: "IBM Plex Mono";
            font-size: 15px;
            font-weight: 700;
            flex: none;
        }

        .step-info {
            flex: 1;
            min-width: 0;
        }

        .step-info h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
        }

        #step-desc {
            margin: 8px 0 0;
            font-size: 13.5px;
            line-height: 1.6;
            color: #cbd5e1;
            font-weight: 300;
        }

        #step-spec {
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.5;
            color: var(--muted);
            border-left: 2px solid var(--ac);
            padding-left: 10px;
        }

        #btnFold {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--muted);
            width: 36px;
            height: 36px;
            flex: none;
            transition: .3s;
            cursor: pointer;
        }

        .track {
            display: flex;
            gap: 4px;
            margin: 20px 0;
        }

        .track i {
            height: 4px;
            flex: 1;
            background: rgba(255, 255, 255, .1);
            border-radius: 2px;
            transition: .3s;
        }

        .track i.on {
            background: var(--ac);
            box-shadow: 0 0 10px rgba(14, 165, 233, .5);
        }

        .dock-card.folded #step-desc {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: .8;
        }

        .dock-card.folded #step-spec,
        .dock-card.folded .dock-body {
            display: none;
        }

        .dock-card.folded .track {
            margin-bottom: 0;
        }

        .dock-card.folded #btnFold {
            transform: rotate(180deg);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: var(--rad-md);
            padding: 12px 8px;
            cursor: pointer;
            transition: .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(.96);
            background: rgba(255, 255, 255, .08);
        }

        .btn:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px;
        }

        .btn.active {
            background: rgba(14, 165, 233, .15);
            border-color: rgba(14, 165, 233, .4);
            color: #bae6fd;
        }

        .btn-run {
            background: rgba(16, 185, 129, .05);
            border-color: rgba(16, 185, 129, .2);
            color: var(--ok);
        }

        .btn-run.active {
            background: var(--ok);
            color: #022c22;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(16, 185, 129, .4);
            border-color: transparent;
        }

        .btn-stop {
            background: rgba(239, 68, 68, .05);
            border-color: rgba(239, 68, 68, .2);
            color: var(--bad);
        }

        .btn-stop.active {
            background: rgba(239, 68, 68, .25);
            color: #fecaca;
            border-color: rgba(239, 68, 68, .5);
        }

        .btn-outline {
            width: 100%;
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, .2);
            margin-bottom: 0;
        }

        .btn-reset {
            width: 100%;
            background: rgba(0, 0, 0, .3);
            border: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
        }

        .btn-wide {
            grid-column: 1 / -1;
        }

        .foldable {
            display: none;
            margin-top: 16px;
            border-top: 1px solid var(--line);
            padding-top: 16px;
            animation: slideDown .3s;
        }

        .foldable.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .sliders {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px 12px;
            align-items: center;
            background: rgba(0, 0, 0, .3);
            padding: 16px;
            border-radius: var(--rad-md);
            margin-bottom: 12px;
        }

        .sliders label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }

        .val {
            font-family: "IBM Plex Mono";
            font-size: 13px;
            color: var(--ac);
            text-align: right;
            min-width: 55px;
            font-weight: 600;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, .1);
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--ac);
            box-shadow: 0 0 10px rgba(255, 255, 255, .4);
        }

        input[type=range]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--ac);
        }

        .fault-box {
            background: rgba(239, 68, 68, .05);
            border: 1px solid rgba(239, 68, 68, .2);
            padding: 12px;
            border-radius: var(--rad-md);
            margin-bottom: 12px;
        }

        .btn-sm {
            padding: 8px 4px;
            font-size: 12px;
            font-family: "IBM Plex Mono";
            font-weight: 600;
            color: #fca5a5;
        }

        .legend {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 11px;
            color: var(--muted);
            justify-content: center;
            margin-top: 16px;
            background: rgba(0, 0, 0, .2);
            padding: 12px;
            border-radius: 10px;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .sw {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        /* ---------------- Detail modal ---------------- */
        #detail {
            position: fixed;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            transition: .3s;
            padding: 20px;
        }

        #detail.show {
            opacity: 1;
            pointer-events: auto;
        }

        #detail .card {
            max-width: 400px;
            border-color: var(--ac);
            background: rgba(15, 23, 33, .95);
            position: relative;
            transform: translateY(20px) scale(.95);
            transition: .3s cubic-bezier(.175, .885, .32, 1.275);
            padding: 24px;
            border-radius: var(--rad-lg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, .6);
        }

        #detail.show .card {
            transform: translateY(0) scale(1);
        }

        #detail h3 {
            margin: 0 40px 12px 0;
            font-size: 18px;
            color: var(--ac);
        }

        #detail p {
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
            color: #e2e8f0;
            font-weight: 300;
        }

        #detail .close {
            position: absolute;
            right: 16px;
            top: 16px;
            background: rgba(255, 255, 255, .1);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #errbar {
            position: fixed;
            left: 8px;
            right: 8px;
            top: calc(74px + env(safe-area-inset-top, 0px));
            z-index: 60;
            display: none;
            background: rgba(120, 20, 20, .94);
            border: 1px solid #ff8a7a;
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 11.5px;
            line-height: 1.5;
            font-family: "IBM Plex Mono", monospace;
            word-break: break-word;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="arjs-loader" id="loader">
        <div class="spinner"></div>
        <div>กำลังเตรียมสภาพแวดล้อม AR…</div>
    </div>

    <div id="errbar"></div>

    <div id="hud-top">
        <div class="glass title-card">
            <h1>VEICHI AC10 Series</h1>
            <p>VFD ทรงแคบ • ภาพตัดขวางจำลอง</p>
        </div>
        <div class="glass status-pill" id="status-pill">
            <span class="dot" id="dot"></span><span id="statustext">ค้นหา Marker</span>
        </div>
    </div>

    <div id="meter" class="glass">
        <div class="big"><span id="mFreq">0.00</span><small>Hz</small></div>
        <div class="sub"><span id="mRpm">0</span> rpm · <span id="mState">STOP</span></div>
        <div class="heatbar">
            <div class="heatfill" id="heatfill"></div>
        </div>
    </div>

    <div id="toast-error" class="glass">
        <div class="toast-head"><b id="fault-code">E.XX</b> <span id="fault-title">Error</span></div>
        <div class="toast-body" id="fault-desc"></div>
        <button class="btn btn-reset" id="btnToastReset">รับทราบและรีเซ็ตระบบ</button>
    </div>

    <div id="detail">
        <div class="card glass">
            <button class="close" id="detailClose">✕</button>
            <h3 id="detailTitle">—</h3>
            <p id="detailBody">—</p>
        </div>
    </div>

    <div id="dock">
        <div class="glass dock-card" id="dockCard">
            <div class="drag-handle" id="btnFoldHandle"></div>

            <div class="step-header">
                <span class="step-num" id="step-num">01</span>
                <div class="step-info">
                    <h2 id="step-title">—</h2>
                    <p id="step-desc">—</p>
                    <p id="step-spec"></p>
                </div>
                <button id="btnFold" title="ย่อแผง">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>

            <div class="track" id="track"></div>

            <div class="dock-body">
                <div class="grid-3">
                    <button class="btn" id="btnPrev">◀ ก่อนหน้า</button>
                    <button class="btn active" id="btnPlay">❚❚ หยุดออโต้</button>
                    <button class="btn" id="btnNext">ถัดไป ▶</button>
                </div>

                <div class="grid-2">
                    <button class="btn btn-run active" id="btnRun">▶ เดินเครื่อง</button>
                    <button class="btn btn-stop" id="btnStop">■ หยุด</button>
                </div>

                <div class="grid-3">
                    <button class="btn active" id="btnCut">เปิดฝา</button>
                    <button class="btn" id="btnExp">แยกชิ้น</button>
                    <button class="btn active" id="btnFlow">เดินไฟ</button>
                </div>

                <div class="grid-2">
                    <button class="btn active" id="btnFace">หันเข้ากล้อง</button>
                    <button class="btn" id="btnTilt">marker บนโต๊ะ</button>
                </div>

                <button class="btn btn-outline" id="btnMore">ตั้งค่าขั้นสูงและจำลองปัญหา</button>

                <div id="more" class="foldable">
                    <div class="sliders">
                        <label for="inFreq">ความถี่เป้าหมาย</label>
                        <input id="inFreq" type="range" min="0" max="120" step="0.5" value="50">
                        <span class="val" id="valFreq">50.0 Hz</span>

                        <label for="inAccel">เวลาเร่ง / ชะลอ</label>
                        <input id="inAccel" type="range" min="1" max="20" step="0.5" value="5">
                        <span class="val" id="valAccel">5.0 s</span>

                        <label for="inSize">ขนาดโมเดล</label>
                        <input id="inSize" type="range" min="0.3" max="1.5" step="0.05" value="0.75">
                        <span class="val" id="valSize">0.75x</span>
                    </div>

                    <div class="fault-box">
                        <p style="margin:0 0 10px; font-size:12px; color:var(--bad); font-weight:600;">จำลองความผิดพลาด
                        </p>
                        <div class="grid-4">
                            <button class="btn btn-sm" data-fault="oC">E.oC</button>
                            <button class="btn btn-sm" data-fault="oU">E.oU</button>
                            <button class="btn btn-sm" data-fault="oH">E.oH</button>
                            <button class="btn btn-sm" data-fault="LU">E.LU</button>
                        </div>
                    </div>

                    <div class="grid-2">
                        <button class="btn" id="btnSound">เปิดเสียงมอเตอร์</button>
                        <button class="btn" id="btnPreview">โหมด 3D หมุนอิสระ</button>
                    </div>

                        <span><i class="sw" style="background:var(--ac)"></i> AC IN</span>
                        <span><i class="sw" style="background:var(--dc)"></i> DC BUS</span>
                        <span><i class="sw" style="background:var(--pwm)"></i> PWM OUT</span>
                        <span><i class="sw" style="background:var(--air)"></i> ลมระบาย</span>

            </div>

    </div>

    <!-- ==================== 3D SCENE ==================== -->
    <a-scene vr-mode-ui="enabled: false" loading-screen="enabled: false"
        renderer="antialias: true; colorManagement: true; alpha: true; precision: medium" embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false; patternRatio: 0.5;">

        <a-entity light="type: hemisphere; color: #ffffff; groundColor: #1e293b; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.6" position="2 4 3"></a-entity>
        <a-entity light="type: directional; color: #7dd3fc; intensity: 0.4" position="-3 2 -2"></a-entity>

        <a-marker id="markerRoot" preset="hiro" smooth="true" smoothCount="8" smoothTolerance="0.012"
            smoothThreshold="4">

        <a-entity camera cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: [data-part], [data-act]; interval: 100">

    <script>
        window.VFD = { target: 50, freq: 0, poles: 4, ramp: 5, running: true, fault: null, heat: 0, flow: true };

        /* ---------------- A-Frame components ---------------- */
        AFRAME.registerComponent('th-label', {
            schema: { text: { default: '' }, width: { default: 0.5 }, size: { default: 40 }, color: { default: '#f8fafc' }, bg: { default: 'rgba(15,23,42,0.8)' }, accent: { default: '#0ea5e9' }, align: { default: 'left' }, mono: { default: false } },
            init() {
                this.canvas = document.createElement('canvas'); this.ctx = this.canvas.getContext('2d');
                this.texture = new THREE.CanvasTexture(this.canvas); this.texture.minFilter = THREE.LinearFilter;
                this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: this.texture, transparent: true, side: THREE.DoubleSide }));
                this.el.setObject3D('mesh', this.mesh);
                this.render();
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.render());
            },
            update() { if (this.mesh) this.render(); },
            render() {
                const d = this.data, S = 2, W = 620, pad = 24 * S, fs = d.size * S;
                const family = d.mono ? '"IBM Plex Mono", monospace' : '"IBM Plex Sans Thai", sans-serif';
                const c = this.canvas, ctx = this.ctx; c.width = W * S; ctx.font = `600 ${fs}px ${family}`;
                const maxW = c.width - pad * 2, lines = [];
                String(d.text || ' ').split('|').forEach(part => {
                    let line = '';
                    part.trim().split(' ').forEach(w => {
                        const t = line ? line + ' ' + w : w;
                        if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
                    });
                    lines.push(line);
                });
                const lh = fs * 1.4; c.height = Math.round(pad * 2 + lh * lines.length);
                ctx.clearRect(0, 0, c.width, c.height);
                if (d.bg !== 'none') {
                    ctx.fillStyle = d.bg; ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(0, 0, c.width, c.height, 16 * S); else ctx.rect(0, 0, c.width, c.height);
                    ctx.fill();
                    ctx.fillStyle = d.accent; ctx.fillRect(0, 0, 8 * S, c.height);
                }
                ctx.font = `600 ${fs}px ${family}`; ctx.fillStyle = d.color; ctx.textBaseline = 'middle'; ctx.textAlign = d.align;
                const x = d.align === 'center' ? c.width / 2 : (d.align === 'right' ? c.width - pad : pad + 10 * S);
                lines.forEach((ln, i) => ctx.fillText(ln, x, pad + lh * (i + 0.5)));
                this.texture.needsUpdate = true;
                this.mesh.geometry.dispose();
                this.mesh.geometry = new THREE.PlaneGeometry(d.width, d.width * (c.height / c.width));
            }
        });

        AFRAME.registerComponent('billboard', { init() { this.camPos = new THREE.Vector3(); }, tick() { const cam = this.el.sceneEl.camera; if (!cam) return; cam.getWorldPosition(this.camPos); this.el.object3D.lookAt(this.camPos); } });

        /* หมุนโมเดลรอบแกนตั้งให้ด้านหน้าเครื่องหันเข้าหากล้องเสมอ */
        AFRAME.registerComponent('face-cam', {
            schema: { enabled: { default: true } },
            init() { this._c = new THREE.Vector3(); },
            tick() {
                if (!this.data.enabled) return;
                const cam = this.el.sceneEl.camera, o = this.el.object3D;
                if (!cam || !o.parent) return;
                cam.getWorldPosition(this._c);
                o.parent.worldToLocal(this._c);
                o.rotation.set(0, Math.atan2(this._c.x - o.position.x, this._c.z - o.position.z), 0);
            }
        });

        AFRAME.registerComponent('glow', { schema: { active: { default: false }, color: { default: '#0ea5e9' } }, init() { this._c = new THREE.Color(this.data.color); this._base = null; }, update() { this._c = new THREE.Color(this.data.color); }, tick(t) { const o = this.el.object3D; if (!o) return; if (this._base === null) this._base = o.scale.x; const on = this.data.active; const k = on ? 0.3 + 0.3 * (0.5 + 0.5 * Math.sin(t / 200)) : 0; o.traverse(n => { const m = n.material; if (!m || !m.emissive) return; m.emissive.set(on ? this._c : 0x000000); m.emissiveIntensity = k; }); const s = this._base * (on ? 1 + 0.02 * (0.5 + 0.5 * Math.sin(t / 200)) : 1); o.scale.set(s, s, s); } });
        AFRAME.registerComponent('heat-tint', { init() { this.cool = new THREE.Color('#94a3b8'); this.hot = new THREE.Color('#dc2626'); this.tmp = new THREE.Color(); this.tick = AFRAME.utils.throttleTick(this.tick, 100, this); }, tick() { this.tmp.copy(this.cool).lerp(this.hot, Math.min(1, VFD.heat)); this.el.object3D.traverse(n => { if (n.material && n.material.color && !n.material.map) n.material.color.copy(this.tmp); }); } });

        AFRAME.registerComponent('energy-flow', {
            schema: { path: { default: '' }, color: { default: '#0ea5e9' }, count: { default: 5 }, speed: { default: 0.5 }, size: { default: 0.025 }, enabled: { default: true }, tracks: { default: 'ac' }, shape: { default: 'sphere' }, line: { default: true } },
            init() {
                this.pts = this.data.path.split(',').map(s => { const a = s.trim().split(/\s+/).map(Number); return new THREE.Vector3(a[0], a[1], a[2]); });
                this.seg = []; this.total = 0;
                for (let i = 0; i < this.pts.length - 1; i++) { const d = this.pts[i].distanceTo(this.pts[i + 1]); this.seg.push(d); this.total += d; }
                const s = this.data.size;
                const geo = this.data.shape === 'arrow' ? new THREE.ConeGeometry(s * 1.2, s * 3.5, 6).rotateX(Math.PI / 2) : new THREE.SphereGeometry(s, 10, 10);
                const mat = new THREE.MeshBasicMaterial({ color: this.data.color, transparent: true, opacity: this.data.shape === 'arrow' ? 0.8 : 1 });
                this.group = new THREE.Group(); this.dots = [];
                for (let i = 0; i < this.data.count; i++) { const m = new THREE.Mesh(geo, mat); this.group.add(m); this.dots.push(m); }
                if (this.data.line) this.group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(this.pts), new THREE.LineBasicMaterial({ color: this.data.color, transparent: true, opacity: 0.25 })));
                this.el.setObject3D('flow', this.group); this._z = new THREE.Vector3(0, 0, 1);
            },
            at(d) {
                d = ((d % this.total) + this.total) % this.total;
                for (let i = 0; i < this.seg.length; i++) { if (d <= this.seg[i]) return { p: this.pts[i].clone().lerp(this.pts[i + 1], this.seg[i] ? d / this.seg[i] : 0), i }; d -= this.seg[i]; }
                return { p: this.pts[this.pts.length - 1].clone(), i: this.seg.length - 1 };
            },
            tick(t) {
                if (!this.group) return;
                this.group.visible = this.data.enabled && VFD.flow && !(this.data.tracks === 'pwm' && VFD.freq < 0.3);
                if (!this.group.visible) return;
                const k = this.data.tracks === 'pwm' ? Math.max(0.1, VFD.freq / 50) : this.data.tracks === 'air' ? Math.max(0.4, VFD.freq / 50) : 1;
                const sp = this.data.speed * k;
                for (let i = 0; i < this.dots.length; i++) {
                    const r = this.at(t / 1000 * sp + i * this.total / this.dots.length);
                    this.dots[i].position.copy(r.p);
                    if (this.data.shape === 'arrow') { const dir = this.pts[r.i + 1].clone().sub(this.pts[r.i]).normalize(); this.dots[i].quaternion.setFromUnitVectors(this._z, dir); }
                }
            }
        });

        AFRAME.registerComponent('scope', {
            schema: { mode: { default: 'ac' }, w: { default: 0.6 } },
            init() {
                this.c = document.createElement('canvas'); this.c.width = 512; this.c.height = 256; this.ctx = this.c.getContext('2d');
                this.tex = new THREE.CanvasTexture(this.c); this.tex.minFilter = THREE.LinearFilter;
                this.el.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(this.data.w, this.data.w * 0.5), new THREE.MeshBasicMaterial({ map: this.tex, transparent: true })));
                this.tick = AFRAME.utils.throttleTick(this.tick, 40, this);
            },
            tick(t) {
                const ctx = this.ctx, W = 512, H = 256, mid = H / 2, A = 90, ph = t / 340;
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = 'rgba(15,23,42,0.9)'; ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
                for (let x = 0; x <= W; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
                for (let y = 0; y <= H; y += 42) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
                const draw = (fn, color, lw) => { ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = lw || 3; for (let x = 0; x <= W; x++) { const y = fn(x / W); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); };

                if (this.data.mode === 'ac') {
                    [['#0ea5e9', 0], ['#10b981', 2.094], ['#a855f7', 4.188]].forEach(([col, off]) => draw(u => mid - A * Math.sin(u * Math.PI * 4 + ph + off), col, 2.5));
                } else if (this.data.mode === 'dc') {
                    const lv = VFD.fault === 'oU' ? 1.15 : VFD.fault === 'LU' ? 0.5 : 0.9;
                    draw(u => mid - A * (lv + 0.05 * Math.abs(Math.sin(u * Math.PI * 12 + ph))), VFD.fault === 'oU' || VFD.fault === 'LU' ? '#ef4444' : '#f97316', 3);
                    ctx.setLineDash([8, 8]); draw(() => mid - A * 0.95, 'rgba(234,179,8,0.5)', 2); ctx.setLineDash([]);
                } else {
                    const f = Math.max(0.001, VFD.freq / 50); const env = u => Math.sin(u * Math.PI * 4 * f + ph * f);
                    if (VFD.freq < 0.3) { draw(() => mid, 'rgba(234,179,8,0.3)', 2); } else {
                        ctx.beginPath(); ctx.strokeStyle = '#eab308'; ctx.lineWidth = 1.6; let prev = mid;
                        for (let x = 0; x <= W; x++) { const u = x / W; const y = mid - A * (Math.sin(u * Math.PI * 120) < env(u) ? 1 : -1) * 0.96; ctx.moveTo(x, prev); ctx.lineTo(x, y); prev = y; }
                        ctx.stroke(); draw(u => mid - A * 0.7 * env(u), '#0ea5e9', 3);
                    }
                }
                this.tex.needsUpdate = true;
            }
        });

            $('#inSize').addEventListener('input', e => applySize(+e.target.value));

            function applyCutaway() { const s = $('#shellFront'); if (s) s.setAttribute('material', 'opacity', cutaway ? 0.15 : 0.95); }
            $('#btnCut').onclick = () => { cutaway = !cutaway; $('#btnCut').classList.toggle('active', cutaway); $('#btnCut').textContent = cutaway ? 'เปิดฝา' : 'ปิดฝา'; applyCutaway(); buzz(10); };
            function applyExplode() { document.querySelectorAll('[data-explode]').forEach(el => { if (!el.dataset.base) { const p = el.getAttribute('position') || { x: 0, y: 0, z: 0 }; el.dataset.base = `${p.x} ${p.y} ${p.z}`; } const b = el.dataset.base.split(' ').map(Number); const o = el.dataset.explode.split(' ').map(Number); const to = exploded ? `${b[0] + o[0]} ${b[1] + o[1]} ${b[2] + o[2]}` : el.dataset.base; el.setAttribute('animation__ex', { property: 'position', to, dur: 700, easing: 'easeOutCubic' }); }); }
            $('#btnExp').onclick = () => { exploded = !exploded; $('#btnExp').classList.toggle('active', exploded); applyExplode(); buzz(15); };
            $('#btnFlow').onclick = () => { VFD.flow = !VFD.flow; $('#btnFlow').classList.toggle('active', VFD.flow); buzz(10); };

            const detail = $('#detail');
            function showDetail(key) {
                const p = PARTS[key]; if (!p) return;
                $('#detailTitle').textContent = p.n; $('#detailBody').textContent = p.d;
                detail.classList.add('show'); setAutoplay(false);
                if (typeof p.s === 'number') { step = p.s; applyStep(); }
                setGlow([key], '#0ea5e9');
                buzz(15);
            }
            function hideDetail() { detail.classList.remove('show'); applyStep(); }
            $('#detailClose').onclick = hideDetail;
            detail.onclick = e => { if (e.target === detail) hideDetail(); };

            document.querySelector('a-scene').addEventListener('click', evt => {
                const el = evt.target; if (!el || !el.closest) return;
                const act = el.closest('[data-act]');
                if (act) {
                    if (act.dataset.act === 'run') { if (VFD.fault) clearFault(); setRunning(true); }
                    else setRunning(false);
                    return;
                }
                const part = el.closest('[data-part]'); if (part) showDetail(part.dataset.part);
            });

            let audio = null;
            $('#btnSound').onclick = () => {
                if (!audio) {
                    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
                    const ctx = new AC(); const gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination);
                    const hum = ctx.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 100;
                    const whine = ctx.createOscillator(); whine.type = 'triangle'; whine.frequency.value = 1400;
                    const wGain = ctx.createGain(); wGain.gain.value = 0.25;
                    hum.connect(gain); whine.connect(wGain); wGain.connect(gain);
                    hum.start(); whine.start(); audio = { ctx, gain, hum, whine, on: false };
                }
                if (audio.ctx.state === 'suspended') audio.ctx.resume();
                audio.on = !audio.on;
                $('#btnSound').classList.toggle('active', audio.on);
                $('#btnSound').textContent = audio.on ? 'ปิดเสียงมอเตอร์' : 'เปิดเสียงมอเตอร์';
                buzz(10);
            };

            /* ---- ลากหมุนและย่อขยายในโหมด 3D อิสระ ---- */
            let drag = false, lastX = 0, lastY = 0, pinchD = 0, baseScale = 0.75;
            const canvasOK = e => mounted === 'preview' && e.target && e.target.tagName === 'CANVAS';
            document.addEventListener('touchstart', e => {
                if (!canvasOK(e)) return;
                if (e.touches.length === 1) { drag = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
                else if (e.touches.length === 2) { pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); baseScale = parseFloat($('#inSize').value); }
            }, { passive: true });
            document.addEventListener('touchmove', e => {
                if (!canvasOK(e)) return;
                const m = $('#modelRoot'); if (!m) return;
                if (e.touches.length === 1 && drag) {
                    userYaw += (e.touches[0].clientX - lastX) * 0.5;
                    rotX = Math.max(-45, Math.min(45, rotX + (e.touches[0].clientY - lastY) * 0.5));
                    m.setAttribute('rotation', `${rotX} ${userYaw} 0`);
                    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
                } else if (e.touches.length === 2 && pinchD) {
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    const v = Math.max(0.3, Math.min(1.5, baseScale * (d / pinchD)));
                    $('#inSize').value = v; applySize(v);
                }
            }, { passive: true });
            document.addEventListener('touchend', () => { drag = false; pinchD = 0; }, { passive: true });

            $('#btnPreview').onclick = () => {
                const to = mounted === 'marker' ? 'preview' : 'marker';
                mount(to);
                $('#btnPreview').textContent = to === 'preview' ? 'กลับไปใช้ AR Marker' : 'โหมด 3D หมุนอิสระ';
                const s = $('#status-pill');
                if (to === 'preview') { s.classList.add('found'); $('#statustext').textContent = 'โหมดจำลอง 3D'; toggleFold(true); }
                else { s.classList.remove('found'); $('#statustext').textContent = 'ค้นหา Marker…'; }
                buzz(20);
            };

            const marker = $('#markerRoot');
            marker.addEventListener('markerFound', () => { if (mounted === 'marker') { $('#status-pill').classList.add('found'); $('#statustext').textContent = 'พบ Marker แล้ว'; buzz(25); } });
            marker.addEventListener('markerLost', () => { if (mounted === 'marker') { $('#status-pill').classList.remove('found'); $('#statustext').textContent = 'ค้นหา Marker…'; } });

            /* ---- ลูปจำลองการทำงาน ---- */
            let last = performance.now(), lastRpm = -1;
            function renderLoop(now) {
                const dt = Math.min(0.1, (now - last) / 1000); last = now;
                const rate = 50 / Math.max(0.5, VFD.ramp);

                if (VFD.fault) VFD.freq = Math.max(0, VFD.freq - rate * 2 * dt);
                else if (VFD.running) { const d = VFD.target - VFD.freq; VFD.freq += Math.sign(d) * Math.min(Math.abs(d), rate * dt); }
                else VFD.freq = Math.max(0, VFD.freq - rate * dt);

                const load = VFD.freq / 50;
                if (VFD.fault !== 'oH') { VFD.heat += (load * 0.9 - VFD.heat) * dt * 0.2; VFD.heat = Math.max(0, Math.min(1, VFD.heat)); }

                const rpm = Math.round(120 * VFD.freq / VFD.poles);
                $('#mFreq').textContent = VFD.fault ? FAULTS[VFD.fault].code : VFD.freq.toFixed(2);
                $('#mRpm').textContent = rpm;
                $('#mState').textContent = VFD.fault ? 'FAULT' : VFD.running ? (Math.abs(VFD.target - VFD.freq) > 0.5 ? 'ACC' : 'RUN') : 'STOP';
                $('#heatfill').style.width = (VFD.heat * 100).toFixed(0) + '%';

                const kp = document.getElementById('kpDisplay');
                if (kp) { const txt = VFD.fault ? (Math.floor(now / 400) % 2 ? FAULTS[VFD.fault].code : ' ') : VFD.freq.toFixed(2); if (kp.dataset.last !== txt) { kp.dataset.last = txt; kp.setAttribute('th-label', 'text', txt); } }

                // อัปเดตป้ายมอเตอร์เฉพาะตอนเลขเปลี่ยนจริง ไม่งั้นจะวาด canvas ใหม่ทุกเฟรม
                const ml = document.getElementById('motorLabel');
                if (ml && rpm !== lastRpm) { lastRpm = rpm; ml.setAttribute('th-label', 'text', `มอเตอร์เหนี่ยวนำ 4 ขั้ว|${rpm} rpm`); }

                if (audio) { const g = (audio.on && VFD.freq > 1) ? 0.04 : 0; audio.gain.gain.setTargetAtTime(g, audio.ctx.currentTime, 0.1); audio.hum.frequency.setTargetAtTime(30 + VFD.freq * 2, audio.ctx.currentTime, 0.1); audio.whine.frequency.setTargetAtTime(500 + VFD.freq * 30, audio.ctx.currentTime, 0.1); }

                requestAnimationFrame(renderLoop);
            }
            requestAnimationFrame(renderLoop);

            /* ---- เริ่มทำงาน: ไม่พึ่งอีเวนต์เดียว กันหน้าโหลดค้าง ---- */
            const scene = document.querySelector('a-scene'); let booted = false;
            function boot() { if (booted) return; booted = true; $('#loader').style.display = 'none'; mount('marker'); setAutoplay(true); fixVideo(); }
            if (scene.hasLoaded) boot();
            scene.addEventListener('loaded', boot);
            scene.addEventListener('renderstart', boot);
            setTimeout(boot, 2500);

            /* ---- แสดง error บนจอ เพราะมือถือเปิด console ไม่ได้ ---- */
            function showErr(msg) { const b = $('#errbar'); b.style.display = 'block'; b.textContent = String(msg).slice(0, 400); }
            window.addEventListener('error', e => {
                if (e.target && e.target.tagName === 'SCRIPT') showErr('โหลดสคริปต์ไม่สำเร็จ: ' + e.target.src);
                else showErr(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno);
            }, true);
            window.addEventListener('unhandledrejection', e => showErr('Promise: ' + (e.reason && e.reason.message || e.reason)));
            window.addEventListener('camera-error', () => showErr('เปิดกล้องไม่สำเร็จ ตรวจสิทธิ์กล้องของเว็บไซต์นี้'));
        })();
    </script>
</body>
