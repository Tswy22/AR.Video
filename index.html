<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>AR • VEICHI AC10 Series Variable Frequency Drive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
         :root {
            --panel: rgba(10, 16, 22, .82);
            --line: rgba(140, 170, 190, .22);
            --text: #e8f0f4;
            --muted: #9fb3bf;
            --ac: #4cc9f0;
            --dc: #ff6b3d;
            --pwm: #ffc94a;
            --air: #7ec8f5;
            --ok: #57d98a;
        }
        
        * {
            box-sizing: border-box
        }
        
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: "IBM Plex Sans Thai", "Noto Sans Thai", Tahoma, sans-serif;
            color: var(--text)
        }
        
        a-scene {
            position: fixed;
            inset: 0
        }
        
        .arjs-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05090d;
            z-index: 50;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            padding: 24px
        }
        
        #hud {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            z-index: 20;
            padding: 10px 12px calc(10px + env(safe-area-inset-top, 0px));
            pointer-events: none;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            justify-content: space-between
        }
        
        .badge {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px)
        }
        
        .badge h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600
        }
        
        .badge p {
            margin: 2px 0 0;
            font-size: 11px;
            color: var(--muted)
        }
        
        #status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 500
        }
        
        #dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dc);
            box-shadow: 0 0 8px currentColor;
            transition: background .2s
        }
        
        #status.found #dot {
            background: var(--ok)
        }
        
        #dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
            pointer-events: none
        }
        
        .card {
            pointer-events: auto;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 14px;
            max-width: 640px;
            margin: 0 auto;
            width: 100%
        }
        
        .stepline {
            display: flex;
            align-items: baseline;
            gap: 9px
        }
        
        .stepno {
            font-family: "IBM Plex Mono", monospace;
            font-size: 12px;
            color: var(--pwm);
            font-weight: 600;
            flex: none
        }
        
        .steptitle {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.35
        }
        
        #stepdesc {
            margin: 6px 0 0;
            font-size: 13px;
            line-height: 1.6;
            color: #cfe0e8
        }
        
        #stepspec {
            margin: 7px 0 0;
            font-size: 11.5px;
            line-height: 1.55;
            color: var(--muted);
            border-left: 2px solid var(--line);
            padding-left: 9px
        }
        
        .track {
            display: flex;
            gap: 4px;
            margin-top: 10px
        }
        
        .track i {
            height: 3px;
            flex: 1;
            background: rgba(255, 255, 255, .14);
            border-radius: 2px;
            transition: background .25s
        }
        
        .track i.on {
            background: var(--pwm)
        }
        
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap
        }
        
        button {
            font: inherit;
            font-size: 13px;
            color: var(--text);
            background: rgba(255, 255, 255, .07);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 8px 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent
        }
        
        button:active {
            transform: translateY(1px)
        }
        
        button:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px
        }
        
        button.on {
            background: rgba(76, 201, 240, .18);
            border-color: rgba(76, 201, 240, .55);
            color: #dff5ff
        }
        
        button.wide {
            flex: 1;
            min-width: 74px;
            text-align: center
        }
        
        .sliders {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px 10px;
            align-items: center;
            margin-top: 10px
        }
        
        .sliders label {
            font-size: 12px;
            color: var(--muted)
        }
        
        .val {
            font-family: "IBM Plex Mono", monospace;
            font-size: 12px;
            color: var(--pwm);
            min-width: 62px;
            text-align: right
        }
        
        input[type=range] {
            width: 100%;
            accent-color: #4cc9f0;
            height: 22px
        }
        
        #more {
            display: none
        }
        
        #more.show {
            display: block
        }
        
        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 11.5px;
            color: var(--muted)
        }
        
        .legend span {
            display: flex;
            align-items: center;
            gap: 5px
        }
        
        .sw {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            display: inline-block
        }
        
        .hint {
            margin: 8px 0 0;
            font-size: 11.5px;
            line-height: 1.6;
            color: var(--muted)
        }
        
        .hint a {
            color: var(--ac)
        }
        
        @media (max-height:620px) {
            #stepspec {
                display: none
            }
        }
    </style>
</head>

<body>

    <div class="arjs-loader" id="loader">กำลังเปิดกล้อง…</div>

    <div id="hud">
        <div class="badge">
            <h1>VEICHI AC10 Series</h1>
            <p>อินเวอร์เตอร์ควบคุมความเร็วรอบ • ภาพตัดขวางแบบ AR</p>
        </div>
        <div class="badge">
            <div id="status"><span id="dot"></span><span id="statustext">ค้นหา marker</span></div>
        </div>
    </div>

    <div id="dock">
        <div class="card">
            <div class="stepline">
                <span class="stepno" id="stepno">00</span>
                <h2 class="steptitle" id="steptitle">—</h2>
            </div>
            <p id="stepdesc">—</p>
            <p id="stepspec"></p>
            <div class="track" id="track"></div>

            <div class="row">
                <button id="prev" class="wide">ย้อนกลับ</button>
                <button id="play" class="wide on">หยุดเล่นอัตโนมัติ</button>
                <button id="next" class="wide">ถัดไป</button>
            </div>

            <div class="sliders">
                <label for="freq">ความถี่เอาต์พุต</label>
                <input id="freq" type="range" min="0" max="60" step="0.5" value="50">
                <span class="val" id="freqval">50.00 Hz</span>
                <label for="size">ขนาดโมเดล</label>
                <input id="size" type="range" min="0.25" max="1.2" step="0.05" value="0.6">
                <span class="val" id="sizeval">0.60×</span>
            </div>

            <div class="row">
                <button id="btnCut" class="on">เปิดฝาดูภายใน</button>
                <button id="btnExp">แยกชิ้นส่วน</button>
                <button id="btnFlow" class="on">การไหลของพลังงาน</button>
                <button id="btnMore">วิธีใช้</button>
            </div>

            <div id="more">
                <div class="legend">
                    <span><i class="sw" style="background:var(--ac)"></i>ไฟเข้า AC</span>
                    <span><i class="sw" style="background:var(--dc)"></i>บัส DC</span>
                    <span><i class="sw" style="background:var(--pwm)"></i>เอาต์พุต PWM</span>
                    <span><i class="sw" style="background:var(--air)"></i>ทิศทางลม</span>
                </div>
                <p class="hint">
                    เปิดหน้านี้ผ่าน <b>https://</b> หรือ <b>localhost</b> เพื่อให้เบราว์เซอร์อนุญาตใช้กล้อง แล้วเล็งไปที่
                    <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" rel="noopener">Hiro marker</a> · ไม่มี marker ก็กด
                    <button id="btnPreview" style="padding:3px 8px;font-size:12px">โหมดไม่ใช้ marker</button>
                </p>
            </div>
        </div>
    </div>

    <a-scene vr-mode-ui="enabled: false" loading-screen="enabled: false" renderer="antialias: true; colorManagement: true; alpha: true; precision: medium" embedded arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false; patternRatio: 0.5;">

        <a-entity light="type: hemisphere; color: #eaf4ff; groundColor: #2b3740; intensity: 1.0"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.7" position="1.6 2.6 2.0"></a-entity>
        <a-entity light="type: directional; color: #9ad8ff; intensity: 0.3" position="-1.8 1.4 -1.6"></a-entity>

        <a-marker id="markerRoot" preset="hiro" smooth="true" smoothCount="8" smoothTolerance="0.012" smoothThreshold="4"></a-marker>

        <a-entity camera>
            <a-entity id="previewRoot" position="0 -0.4 -2.6"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        window.VFD = {
            freq: 50,
            poles: 4,
            flow: true
        };

        /* ---------- ป้ายภาษาไทยบน canvas (a-text ไม่รองรับอักษรไทย) ---------- */
        AFRAME.registerComponent('th-label', {
            schema: {
                text: {
                    default: ''
                },
                width: {
                    default: 0.5
                },
                size: {
                    default: 40
                },
                color: {
                    default: '#e8f0f4'
                },
                bg: {
                    default: 'rgba(8,14,20,0.86)'
                },
                accent: {
                    default: '#4cc9f0'
                },
                align: {
                    default: 'left'
                },
                mono: {
                    default: false
                }
            },
            init() {
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.texture = new THREE.CanvasTexture(this.canvas);
                this.texture.minFilter = THREE.LinearFilter;
                this.mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({
                        map: this.texture,
                        transparent: true,
                        side: THREE.DoubleSide
                    })
                );
                this.el.setObject3D('mesh', this.mesh);
                this.render();
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.render());
            },
            update() {
                if (this.mesh) this.render();
            },
            render() {
                const d = this.data,
                    S = 2,
                    W = 620,
                    pad = 26 * S,
                    fs = d.size * S;
                const family = d.mono ? '"IBM Plex Mono", monospace' :
                    '"IBM Plex Sans Thai", "Noto Sans Thai", Tahoma, sans-serif';
                const c = this.canvas,
                    ctx = this.ctx;
                c.width = W * S;
                ctx.font = `600 ${fs}px ${family}`;

                const maxW = c.width - pad * 2,
                    lines = [];
                d.text.split('|').forEach(part => {
                    let line = '';
                    part.trim().split(' ').forEach(w => {
                        const t = line ? line + ' ' + w : w;
                        if (ctx.measureText(t).width > maxW && line) {
                            lines.push(line);
                            line = w;
                        } else line = t;
                    });
                    lines.push(line);
                });

                const lh = fs * 1.42;
                c.height = Math.round(pad * 2 + lh * lines.length);
                ctx.clearRect(0, 0, c.width, c.height);
                if (d.bg !== 'none') {
                    ctx.fillStyle = d.bg;
                    ctx.beginPath();
                    ctx.roundRect ? ctx.roundRect(0, 0, c.width, c.height, 18 * S) : ctx.rect(0, 0, c.width, c.height);
                    ctx.fill();
                    ctx.fillStyle = d.accent;
                    ctx.fillRect(0, 0, 7 * S, c.height);
                }
                ctx.font = `600 ${fs}px ${family}`;
                ctx.fillStyle = d.color;
                ctx.textBaseline = 'middle';
                ctx.textAlign = d.align;
                const x = d.align === 'center' ? c.width / 2 : (d.align === 'right' ? c.width - pad : pad + 6 * S);
                lines.forEach((ln, i) => ctx.fillText(ln, x, pad + lh * (i + 0.5)));

                this.texture.needsUpdate = true;
                this.mesh.geometry.dispose();
                this.mesh.geometry = new THREE.PlaneGeometry(d.width, d.width * (c.height / c.width));
            }
        });

        /* ---------- หันเข้าหากล้อง ---------- */
        AFRAME.registerComponent('billboard', {
            init() {
                this._v = new THREE.Vector3();
            },
            tick() {
                const cam = this.el.sceneEl.camera;
                if (!cam) return;
                cam.getWorldPosition(this._v);
                this.el.object3D.lookAt(this._v);
            }
        });

        /* ---------- ไฮไลต์ชิ้นส่วนที่กำลังอธิบาย ---------- */
        AFRAME.registerComponent('glow', {
            schema: {
                active: {
                    default: false
                },
                color: {
                    default: '#4cc9f0'
                }
            },
            init() {
                this._c = new THREE.Color(this.data.color);
                this._base = null;
            },
            tick(t) {
                const o = this.el.object3D;
                if (!o) return;
                if (this._base === null) this._base = o.scale.x;
                const on = this.data.active;
                const k = on ? 0.30 + 0.32 * (0.5 + 0.5 * Math.sin(t / 210)) : 0;
                o.traverse(n => {
                    const m = n.material;
                    if (!m || !m.emissive) return;
                    m.emissive.set(on ? this._c : 0x000000);
                    m.emissiveIntensity = k;
                });
                const s = this._base * (on ? 1 + 0.03 * (0.5 + 0.5 * Math.sin(t / 210)) : 1);
                o.scale.set(s, s, s);
            }
        });

        /* ---------- เส้นทางการไหล: พลังงานไฟฟ้า (ทรงกลม) และลมระบายความร้อน (ลูกศร) ---------- */
        AFRAME.registerComponent('energy-flow', {
            schema: {
                path: {
                    default: ''
                },
                color: {
                    default: '#4cc9f0'
                },
                count: {
                    default: 5
                },
                speed: {
                    default: 0.45
                },
                size: {
                    default: 0.022
                },
                enabled: {
                    default: true
                },
                tracks: {
                    default: 'ac'
                },
                shape: {
                    default: 'sphere'
                },
                line: {
                    default: true
                }
            },
            init() {
                this.pts = this.data.path.split(',').map(s => {
                    const a = s.trim().split(/\s+/).map(Number);
                    return new THREE.Vector3(a[0], a[1], a[2]);
                });
                this.seg = [];
                this.total = 0;
                for (let i = 0; i < this.pts.length - 1; i++) {
                    const d = this.pts[i].distanceTo(this.pts[i + 1]);
                    this.seg.push(d);
                    this.total += d;
                }
                const s = this.data.size;
                let geo;
                if (this.data.shape === 'arrow') {
                    geo = new THREE.ConeGeometry(s * 1.5, s * 3.4, 8);
                    geo.rotateX(Math.PI / 2); // ให้ปลายกรวยชี้ไปทาง +Z
                } else {
                    geo = new THREE.SphereGeometry(s, 10, 10);
                }
                const mat = new THREE.MeshBasicMaterial({
                    color: this.data.color,
                    transparent: true,
                    opacity: this.data.shape === 'arrow' ? 0.85 : 1
                });
                this.group = new THREE.Group();
                this.dots = [];
                for (let i = 0; i < this.data.count; i++) {
                    const m = new THREE.Mesh(geo, mat);
                    this.group.add(m);
                    this.dots.push(m);
                }
                if (this.data.line) {
                    this.group.add(new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints(this.pts),
                        new THREE.LineBasicMaterial({
                            color: this.data.color,
                            transparent: true,
                            opacity: 0.35
                        })
                    ));
                }
                this.el.setObject3D('flow', this.group);
                this._z = new THREE.Vector3(0, 0, 1);
            },
            at(d) {
                d = ((d % this.total) + this.total) % this.total;
                for (let i = 0; i < this.seg.length; i++) {
                    if (d <= this.seg[i]) return {
                        p: this.pts[i].clone().lerp(this.pts[i + 1], this.seg[i] ? d / this.seg[i] : 0),
                        i
                    };
                    d -= this.seg[i];
                }
                return {
                    p: this.pts[this.pts.length - 1].clone(),
                    i: this.seg.length - 1
                };
            },
            tick(t) {
                if (!this.group) return;
                this.group.visible = this.data.enabled && VFD.flow;
                if (!this.group.visible) return;
                const f = this.data.tracks === 'pwm' ? Math.max(0.06, VFD.freq / 50) : 1;
                const sp = this.data.speed * f;
                for (let k = 0; k < this.dots.length; k++) {
                    const r = this.at(t / 1000 * sp + k * this.total / this.dots.length);
                    this.dots[k].position.copy(r.p);
                    if (this.data.shape === 'arrow') {
                        const dir = this.pts[r.i + 1].clone().sub(this.pts[r.i]).normalize();
                        this.dots[k].quaternion.setFromUnitVectors(this._z, dir);
                    }
                }
            }
        });

        /* ---------- จอรูปคลื่นจำลอง ---------- */
        AFRAME.registerComponent('scope', {
            schema: {
                mode: {
                    default: 'ac'
                },
                w: {
                    default: 0.56
                }
            },
            init() {
                this.c = document.createElement('canvas');
                this.c.width = 512;
                this.c.height = 256;
                this.ctx = this.c.getContext('2d');
                this.tex = new THREE.CanvasTexture(this.c);
                this.tex.minFilter = THREE.LinearFilter;
                this.el.setObject3D('mesh', new THREE.Mesh(
                    new THREE.PlaneGeometry(this.data.w, this.data.w * 0.5),
                    new THREE.MeshBasicMaterial({
                        map: this.tex,
                        transparent: true
                    })
                ));
                this.tick = AFRAME.utils.throttleTick(this.tick, 40, this);
            },
            tick(t) {
                const ctx = this.ctx,
                    W = 512,
                    H = 256,
                    mid = H / 2,
                    A = 82,
                    ph = t / 340;
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = 'rgba(6,12,17,0.9)';
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = 'rgba(140,180,200,0.16)';
                ctx.lineWidth = 1;
                for (let x = 0; x <= W; x += 64) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, H);
                    ctx.stroke();
                }
                for (let y = 0; y <= H; y += 42) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }

                const draw = (fn, color, lw) => {
                    ctx.beginPath();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = lw || 3;
                    for (let x = 0; x <= W; x++) {
                        const y = fn(x / W);
                        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                    }
                    ctx.stroke();
                };

                if (this.data.mode === 'ac') {
                    [
                        ['#4cc9f0', 0],
                        ['#7ee0a0', 2.094],
                        ['#c9a6ff', 4.188]
                    ].forEach(([col, off]) =>
                        draw(u => mid - A * Math.sin(u * Math.PI * 4 + ph + off), col, 2.5));
                } else if (this.data.mode === 'dc') {
                    draw(u => mid - A * (0.9 + 0.055 * Math.abs(Math.sin(u * Math.PI * 12 + ph))), '#ff6b3d', 3);
                    ctx.setLineDash([7, 7]);
                    draw(() => mid - A * 0.93, 'rgba(255,201,74,0.75)', 2);
                    ctx.setLineDash([]);
                } else {
                    const f = Math.max(0.001, VFD.freq / 50);
                    const env = u => Math.sin(u * Math.PI * 4 * f + ph * f);
                    ctx.beginPath();
                    ctx.strokeStyle = '#ffc94a';
                    ctx.lineWidth = 1.6;
                    let prev = mid;
                    for (let x = 0; x <= W; x++) {
                        const u = x / W;
                        const y = mid - A * (Math.sin(u * Math.PI * 120) < env(u) ? 1 : -1) * 0.98;
                        ctx.moveTo(x, prev);
                        ctx.lineTo(x, y);
                        prev = y;
                    }
                    ctx.stroke();
                    draw(u => mid - A * 0.72 * env(u), '#4cc9f0', 3);
                }
                this.tex.needsUpdate = true;
            }
        });

        /* ---------- การหมุน: เพลามอเตอร์ / ใบพัดลม ---------- */
        AFRAME.registerComponent('spin', {
            schema: {
                rate: {
                    default: 200
                },
                fromFreq: {
                    default: false
                }
            },
            tick(time, dt) {
                if (!dt) return;
                const r = this.data.fromFreq ? (VFD.freq / 50) * this.data.rate : this.data.rate;

                s: 'ไฟเข้า 380 V จะได้บัส DC ราว 513 V ดูจอด้านซ้าย: ไซน์สามเฟสกลายเป็นไฟตรง 6 พัลส์',
                p: ['rectifier'],

            {

                s: 'อันตราย: คาปาซิเตอร์ยังเก็บประจุหลังตัดไฟ ต้องรออย่างน้อย 5 นาทีและวัดแรงดันให้เป็นศูนย์ก่อนสัมผัส',
                p: ['caps'],
                f: {

            },

            {

                d: 'IGBT หกตัวสลับต่อขั้วบวกและลบของบัส DC เข้ากับสาย U V W ด้วยเทคนิค PWM ความกว้างพัลส์ที่เปลี่ยนไปทำให้กระแสในขดลวดมอเตอร์มีรูปคลื่นใกล้เคียงไซน์',
                s: 'ความถี่สวิตชิ่งปรับได้ราว 2–16 kHz ตั้งสูงมอเตอร์เงียบขึ้นแต่ IGBT ร้อนขึ้น',

                f: {

            {

                s: 'สั่งงานได้จากปุ่ม RUN/STOP และปุ่มหมุนหน้าเครื่อง ขั้วสัญญาณดิจิทัลและอนาล็อก หรือผ่าน Modbus RTU บน RS485',
                p: ['pcb', 'keypad'],
                f: {}
            },

            {
                t: 'เอาต์พุตสู่มอเตอร์',
                d: 'ไฟ PWM ออกที่ขั้ว U V W ความเร็วรอบซิงโครนัสคำนวณจาก n = 120 × f ÷ จำนวนขั้ว ลองเลื่อนแถบความถี่แล้วดูเพลามอเตอร์ ตัวเลขบนจอ และรูปคลื่นเปลี่ยนตามกัน',
                s: 'มอเตอร์ 4 ขั้วที่ 50 Hz ได้ 1500 rpm ที่ 25 Hz เหลือ 750 rpm (ความเร็วเพลาในภาพลดสเกลลงให้ตามองทัน)',
                p: ['output', 'motor'],
                f: {
                    pwm: 1
                }
            },

            {
                t: 'ช่องลมอิสระและการระบายความร้อน',
                d: 'ผนังกั้นแยกห้องลมออกจากห้องวงจร อากาศเย็นถูกดูดเข้าด้านหลัง ผ่านครีบฮีตซิงก์ที่รับความร้อนจากไดโอดและ IGBT แล้วพัดลมคู่เป่าออก โดยฝุ่นไม่ผ่านเข้าไปเกาะแผงวงจร',
                s: 'ตัวเครื่องเป็น IP20 สำหรับติดตั้งในตู้คอนโทรล ต้องเว้นระยะรอบตัวเครื่องตามคู่มือ และลดโหลดเมื่ออุณหภูมิรอบข้างสูงเกินพิกัด',
                p: ['heatsink', 'fan', 'partition'],
                f: {
                    air: 1
                }
            }
        ];

        /* ---------- ตรรกะควบคุม ---------- */
        (function() {
            const $ = s => document.querySelector(s);
            let step = 0,
                autoplay = true,
                timer = null,
                exploded = false,
                cutaway = true,
                mounted = 'marker';

            function mount(where) {
                const marker = $('#markerRoot'),
                    preview = $('#previewRoot');
                marker.innerHTML = '';
                preview.innerHTML = '';
                (where === 'marker' ? marker : preview).innerHTML = buildModel();
                mounted = where;
                setTimeout(() => {
                    applyStep();
                    applySize(+$('#size').value);
                    applyCutaway();
                    applyExplode();
                    applyFreq();
                }, 130);
            }

            const track = $('#track');
            STEPS.forEach(() => track.appendChild(document.createElement('i')));

            function applyStep() {
                const st = STEPS[step];
                $('#stepno').textContent = String(step).padStart(2, '0');
                $('#steptitle').textContent = st.t;
                $('#stepdesc').textContent = st.d;
                $('#stepspec').textContent = st.s || '';
                [...track.children].forEach((el, i) => el.classList.toggle('on', i <= step));

                const plate = $('#stepPlate');
                if (plate) plate.setAttribute('th-label', 'text', `${step === 0 ? '' : step + ') '}${st.t}|${st.d}`);

                document.querySelectorAll('[data-part]').forEach(el => {
                    if (el.components && el.components.glow) el.setAttribute('glow', 'active', st.p.includes(el.dataset.part));
                });

                const f = st.f || {};
                const setFlow = (id, on) => {
                    const e = $(id);
                    if (e) e.setAttribute('energy-flow', 'enabled', !!on);
                };
                setFlow('#flowAC', f.ac);
                setFlow('#flowDC', f.dc);
                setFlow('#flowPWM', f.pwm);
                setFlow('#flowAirIn', f.air);
                setFlow('#flowAirOut', f.air);
            }

            function go(n) {
                step = (n + STEPS.length) % STEPS.length;
                applyStep();
            }

            function setAutoplay(on) {
                autoplay = on;
                $('#play').classList.toggle('on', on);
                $('#play').textContent = on ? 'หยุดเล่นอัตโนมัติ' : 'เล่นอัตโนมัติ';
                clearInterval(timer);
                if (on) timer = setInterval(() => go(step + 1), 8000);
            }

            $('#next').onclick = () => {
                setAutoplay(false);
                go(step + 1);
            };
            $('#prev').onclick = () => {
                setAutoplay(false);
                go(step - 1);
            };
            $('#play').onclick = () => setAutoplay(!autoplay);
            $('#btnMore').onclick = () => {
                $('#more').classList.toggle('show');
                $('#btnMore').classList.toggle('on');
            };
            $('#btnFlow').onclick = () => {
                VFD.flow = !VFD.flow;
                $('#btnFlow').classList.toggle('on', VFD.flow);
            };

            function applyCutaway() {
                const s = $('#shellFront');
                if (s) s.setAttribute('material', 'opacity', cutaway ? 0.1 : 0.95);
            }
            $('#btnCut').onclick = () => {
                cutaway = !cutaway;
                $('#btnCut').classList.toggle('on', cutaway);
                $('#btnCut').textContent = cutaway ? 'เปิดฝาดูภายใน' : 'ปิดฝาเครื่อง';
                applyCutaway();
            };

            function applyExplode() {
                document.querySelectorAll('[data-explode]').forEach(el => {
                    if (!el.dataset.base) {
                        const p = el.getAttribute('position') || {
                            x: 0,
                            y: 0,
                            z: 0
                        };
                        el.dataset.base = `${p.x} ${p.y} ${p.z}`;
                    }
                    const b = el.dataset.base.split(' ').map(Number);
                    const o = el.dataset.explode.split(' ').map(Number);
                    const to = exploded ? `${b[0] + o[0]} ${b[1] + o[1]} ${b[2] + o[2]}` : el.dataset.base;
                    el.setAttribute('animation__ex', {
                        property: 'position',
                        to,
                        dur: 650,
                        easing: 'easeOutCubic'
                    });
                });
            }
            $('#btnExp').onclick = () => {
                exploded = !exploded;
                $('#btnExp').classList.toggle('on', exploded);
                applyExplode();
            };

            function applyFreq() {
                const f = VFD.freq;
                $('#freqval').textContent = f.toFixed(2) + ' Hz';
                const kp = $('#kpDisplay');
                if (kp) kp.setAttribute('th-label', 'text', f.toFixed(2));
                const ml = $('#motorLabel');
                if (ml) ml.setAttribute('th-label', 'text',
                    `มอเตอร์เหนี่ยวนำ 3 เฟส 4 ขั้ว|${Math.round(120 * f / VFD.poles)} rpm`);
            }
            $('#freq').addEventListener('input', e => {
                VFD.freq = +e.target.value;
                applyFreq();
            });

            function applySize(v) {
                const m = $('#modelRoot');
                if (m) m.setAttribute('scale', `${v} ${v} ${v}`);
                $('#sizeval').textContent = (+v).toFixed(2) + '×';
            }
            $('#size').addEventListener('input', e => applySize(+e.target.value));

            $('#btnPreview').onclick = () => {
                const to = mounted === 'marker' ? 'preview' : 'marker';
                mount(to);
                $('#btnPreview').textContent = to === 'preview' ? 'กลับไปใช้ marker' : 'โหมดไม่ใช้ marker';
                setStatus(to === 'preview' ? 'preview' : 'searching');
            };

            function setStatus(mode) {
                $('#status').classList.toggle('found', mode === 'found' || mode === 'preview');
                $('#statustext').textContent = mode === 'found' ? 'พบ marker แล้ว' :
                    mode === 'preview' ? 'โหมดไม่ใช้ marker' : 'ค้นหา marker';
            }

            const marker = $('#markerRoot');
            marker.addEventListener('markerFound', () => {
                if (mounted === 'marker') setStatus('found');
            });
            marker.addEventListener('markerLost', () => {
                if (mounted === 'marker') setStatus('searching');
            });

            const scene = document.querySelector('a-scene');
            const start = () => {
                $('#loader').style.display = 'none';
                mount('marker');
                setAutoplay(true);
            };
            scene.hasLoaded ? start() : scene.addEventListener('loaded', start);

            window.addEventListener('camera-error', () => {
                $('#loader').style.display = 'flex';
                $('#loader').textContent = 'เปิดกล้องไม่สำเร็จ ตรวจสอบว่าเปิดผ่าน https และอนุญาตสิทธิ์กล้องแล้ว';
            });
        })();
    </script>
