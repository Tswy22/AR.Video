<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>AR • VEICHI AC10 Series Variable Frequency Drive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        :root {
            --panel: rgba(18, 24, 32, 0.75);
            --line: rgba(255, 255, 255, 0.15);
            --text: #f8fafc;
            --muted: #94a3b8;
            --ac: #38bdf8;
            --dc: #f97316;
            --pwm: #eab308;
            --air: #7dd3fc;
            --ok: #10b981;
            --bad: #ef4444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #05080d;
            font-family: "IBM Plex Sans Thai", sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* ภาพจากกล้องอยู่ชั้น 0 (เหนือพื้นหลัง) ฉาก 3 มิติอยู่ชั้น 1 UI อยู่ชั้น 20 ขึ้นไป
           หลีกเลี่ยง z-index ติดลบ เพราะจะจมอยู่ใต้พื้นหลังของหน้าเว็บ */
        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: 0 !important;
            display: block !important;
        }

        a-scene {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: transparent;
        }

        .a-canvas {
            background: transparent !important;
        }

        .arjs-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #0f172a;
            z-index: 999;
            color: var(--muted);
            font-size: 15px;
            font-weight: 500;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--ac);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .glass {
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* ---------------- HUD ---------------- */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            pointer-events: none;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .badge {
            padding: 12px 16px;
            border-radius: 16px;
            pointer-events: auto;
        }

        .badge h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.2px;
        }

        .badge p {
            margin: 4px 0 0;
            font-size: 11px;
            color: var(--muted);
        }

        #status-pill {
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: auto;
            flex: none;
        }

        #dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dc);
            box-shadow: 0 0 8px var(--dc);
            transition: .3s;
        }

        .found #dot {
            background: var(--ok);
            box-shadow: 0 0 8px var(--ok);
        }

        /* ---------------- Live meter ---------------- */
        #meter {
            position: fixed;
            right: 16px;
            top: calc(96px + env(safe-area-inset-top, 0px));
            z-index: 20;
            padding: 14px 16px;
            text-align: right;
            min-width: 140px;
            border-radius: 16px;
            border-right: 4px solid var(--pwm);
        }

        #meter .big {
            font-family: "IBM Plex Mono", monospace;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        #meter .big small {
            font-size: 12px;
            color: var(--muted);
            font-family: "IBM Plex Sans Thai";
            margin-left: 4px;
        }

        #meter .sub {
            font-family: "IBM Plex Mono", monospace;
            font-size: 12px;
            color: var(--pwm);
            margin-top: 6px;
            font-weight: 600;
        }

        #meter.fault {
            border-right-color: var(--bad);
        }

        #meter.fault .big {
            color: var(--bad);
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: .4;
            }
        }

        #heatbar {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, .1);
            margin-top: 10px;
            overflow: hidden;
        }

        #heatfill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--ac), var(--pwm), var(--bad));
            transition: width .3s;
        }

        /* ---------------- Toast แจ้งความผิดพลาด ---------------- */
        #faultbar {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top, 0px));
            left: 16px;
            right: 16px;
            z-index: 50;
            max-width: 440px;
            margin: 0 auto;
            padding: 16px;
            border-radius: 16px;
            background: rgba(150, 20, 20, .95);
            border: 1px solid #f87171;
            box-shadow: 0 12px 32px rgba(220, 20, 20, .4);
            transform: translateY(-160%);
            transition: .4s cubic-bezier(.2, .8, .2, 1);
            pointer-events: none;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        #faultbar.show {
            transform: translateY(0);
            pointer-events: auto;
        }

        .fault-head {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .fault-head b {
            font-family: "IBM Plex Mono";
            font-size: 14px;
            color: #b91c1c;
            background: #fff;
            padding: 3px 9px;
            border-radius: 6px;
        }

        .fault-head span {
            font-weight: 600;
            color: #fff;
            font-size: 15px;
        }

        .fault-body {
            font-size: 13px;
            line-height: 1.6;
            color: #fecaca;
            margin-top: 10px;
        }

        #btnToastReset {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, .3);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 10px;
            font-weight: 600;
        }

        #btnToastReset:active {
            background: rgba(0, 0, 0, .5);
            transform: scale(.98);
        }

        /* ---------------- Bottom sheet ---------------- */
        #dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            pointer-events: none;
            padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            max-width: 600px;
            padding: 16px 20px;
            border-radius: 24px;
            pointer-events: auto;
            transition: .3s cubic-bezier(.25, .8, .25, 1);
        }

        .drag-handle {
            width: 44px;
            height: 5px;
            background: rgba(255, 255, 255, .25);
            border-radius: 3px;
            margin: 0 auto 14px;
            cursor: pointer;
        }

        .stepline {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .stepno {
            background: rgba(56, 189, 248, .15);
            color: var(--ac);
            border: 1px solid rgba(56, 189, 248, .3);
            padding: 4px 10px;
            border-radius: 8px;
            font-family: "IBM Plex Mono";
            font-size: 14px;
            font-weight: 700;
            flex: none;
        }

        .steptitle {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
        }

        #stepdesc {
            margin: 8px 0 0;
            font-size: 13.5px;
            line-height: 1.6;
            color: #cbd5e1;
            font-weight: 300;
        }

        #stepspec {
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.5;
            color: var(--muted);
            border-left: 2px solid var(--line);
            padding-left: 10px;
        }

        .track {
            display: flex;
            gap: 4px;
            margin: 16px 0;
        }

        .track i {
            height: 4px;
            flex: 1;
            background: rgba(255, 255, 255, .1);
            border-radius: 2px;
            transition: .3s;
        }

        .track i.on {
            background: var(--ac);
            box-shadow: 0 0 8px rgba(56, 189, 248, .5);
        }

        .card.folded #stepdesc {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: .8;
        }

        .card.folded #stepspec {
            display: none;
        }

        .card.folded #panelBody {
            display: none;
        }

        .card.folded .track {
            margin-bottom: 0;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .btn-grid.cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        button {
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 12px;
            padding: 10px 8px;
            cursor: pointer;
            transition: .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(.96);
        }

        button:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px;
        }

        button.on {
            background: rgba(56, 189, 248, .15);
            border-color: rgba(56, 189, 248, .4);
            color: #bae6fd;
        }

        button.run {
            background: rgba(16, 185, 129, .15);
            border-color: rgba(16, 185, 129, .4);
            color: #a7f3d0;
        }

        button.run.on {
            background: var(--ok);
            color: #04140e;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(16, 185, 129, .4);
        }

        button.stop {
            background: rgba(239, 68, 68, .15);
            border-color: rgba(239, 68, 68, .4);
            color: #fecaca;
        }

        .foldable {
            display: none;
            margin-top: 16px;
            border-top: 1px solid var(--line);
            padding-top: 16px;
        }

        .foldable.show {
            display: block;
            animation: fadeIn .3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .sliders {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px 14px;
            align-items: center;
            background: rgba(0, 0, 0, .2);
            padding: 14px;
            border-radius: 14px;
        }

        .sliders label {
            font-size: 12px;
            color: var(--muted);
        }

        .val {
            font-family: "IBM Plex Mono";
            font-size: 13px;
            color: var(--ac);
            text-align: right;
            min-width: 55px;
            font-weight: 600;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, .15);
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--ac);
            box-shadow: 0 0 10px rgba(56, 189, 248, .5);
        }

        input[type=range]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: var(--ac);
        }

        .fault-box {
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .3);
            padding: 12px;
            border-radius: 14px;
            margin-top: 12px;
        }

        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 11px;
            color: var(--muted);
            justify-content: center;
            margin-top: 16px;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sw {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
        }

        /* ---------------- Detail modal ---------------- */
        #detail {
            position: fixed;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            transition: .3s;
            padding: 20px;
        }

        #detail.show {
            opacity: 1;
            pointer-events: auto;
        }

        #detail .card {
            max-width: 420px;
            border-color: var(--ac);
            background: rgba(15, 23, 33, .95);
            position: relative;
            transform: translateY(20px);
            transition: .3s cubic-bezier(.175, .885, .32, 1.275);
        }

        #detail.show .card {
            transform: translateY(0);
        }

        #detail h3 {
            margin: 0 40px 10px 0;
            font-size: 18px;
            color: var(--ac);
        }

        #detail p {
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
            color: #e2e8f0;
            font-weight: 300;
        }

        #detail .close {
            position: absolute;
            right: 14px;
            top: 14px;
            background: rgba(255, 255, 255, .1);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            padding: 0;
        }

        #errbar {
            position: fixed;
            left: 8px;
            right: 8px;
            top: calc(70px + env(safe-area-inset-top, 0px));
            z-index: 60;
            display: none;
            background: rgba(120, 20, 20, .92);
            border: 1px solid #ff8a7a;
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 11.5px;
            line-height: 1.5;
            font-family: "IBM Plex Mono", monospace;
            word-break: break-word;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="arjs-loader" id="loader">
        <div class="spinner"></div>
        <div>กำลังเตรียมสภาพแวดล้อม AR…</div>
    </div>

    <div id="errbar"></div>

    <div id="hud">
        <div class="glass badge">
            <h1>VEICHI AC10 Series</h1>
            <p>VFD แบบ Book design • ภาพตัดขวาง</p>
        </div>
        <div class="glass" id="status-pill">
            <span id="dot"></span><span id="statustext">ค้นหา Marker</span>
        </div>
    </div>

    <div id="meter" class="glass">
        <div class="big"><span id="mFreq">0.00</span><small>Hz</small></div>
        <div class="sub"><span id="mRpm">0</span> rpm · <span id="mState">STOP</span></div>
        <div id="heatbar">
            <div id="heatfill"></div>
        </div>
    </div>

    <div id="faultbar">
        <div id="faultmsg"></div>
    </div>

    <div id="detail">
        <div class="card glass">
            <button class="close" id="detailClose">✕</button>
            <h3 id="detailTitle">—</h3>
            <p id="detailBody">—</p>
        </div>
    </div>

    <div id="dock">
        <div class="card glass" id="dockCard">
            <div class="drag-handle" id="btnFoldHandle"></div>

            <div class="stepline">
                <span class="stepno" id="stepno">01</span>
                <div style="flex:1;">
                    <h2 class="steptitle" id="steptitle">—</h2>
                    <p id="stepdesc">—</p>
                    <p id="stepspec"></p>
                </div>
                <button id="btnFold" title="ย่อแผง"
                    style="flex:none; width:32px; background:transparent; border:none; font-size:22px; padding:0; color:var(--muted); transition:transform .3s">▾</button>
            </div>

            <div class="track" id="track"></div>

            <div id="panelBody">
                <div class="btn-grid">
                    <button id="prev">◀ ย้อนกลับ</button>
                    <button id="play" class="on">❚❚ หยุดออโต้</button>
                    <button id="next">ถัดไป ▶</button>
                </div>

                <div class="btn-grid cols-2">
                    <button id="btnRun" class="run on">▶ เดินเครื่อง</button>
                    <button id="btnStop" class="stop">■ หยุด</button>
                </div>

                <div class="btn-grid cols-2">
                    <button id="btnCut" class="on">เปิดฝาดู</button>
                    <button id="btnExp">แยกชิ้นส่วน</button>
                    <button id="btnFlow" class="on">ทางเดินไฟ</button>
                    <button id="btnFace" class="on">หันเข้ากล้อง</button>
                    <button id="btnTilt" style="grid-column:1/-1">marker วางบนโต๊ะ · แตะเพื่อสลับเป็นบนจอ</button>
                </div>

                <button id="btnMore"
                    style="width:100%; margin-top:12px; background:rgba(255,255,255,0.03); border-style:dashed;">ตั้งค่าขั้นสูงและจำลองปัญหา</button>

                <div id="more" class="foldable">
                    <div class="sliders">
                        <label for="freq">ความถี่เป้าหมาย</label>
                        <input id="freq" type="range" min="0" max="120" step="0.5" value="50">
                        <span class="val" id="freqval">50.0 Hz</span>

                        <label for="accel">เวลาเร่ง / ชะลอ</label>
                        <input id="accel" type="range" min="1" max="20" step="0.5" value="5">
                        <span class="val" id="accelval">5.0 s</span>

                        <label for="size">ขนาดโมเดล</label>
                        <input id="size" type="range" min="0.25" max="1.2" step="0.05" value="0.6">
                        <span class="val" id="sizeval">0.60×</span>
                    </div>

                    <div class="fault-box">
                        <p style="margin:0 0 8px; font-size:12px; color:var(--bad); font-weight:600;">จำลองความผิดพลาด
                        </p>
                        <div class="btn-grid" style="grid-template-columns: repeat(4, 1fr); margin-top:0;">
                            <button style="padding:8px 4px; font-size:12px;" data-fault="oC">E.oC</button>
                            <button style="padding:8px 4px; font-size:12px;" data-fault="oU">E.oU</button>
                            <button style="padding:8px 4px; font-size:12px;" data-fault="oH">E.oH</button>
                            <button style="padding:8px 4px; font-size:12px;" data-fault="LU">E.LU</button>
                        </div>
                    </div>

                    <div class="legend">
                        <span><i class="sw" style="background:var(--ac)"></i> AC IN</span>
                        <span><i class="sw" style="background:var(--dc)"></i> DC BUS</span>
                        <span><i class="sw" style="background:var(--pwm)"></i> PWM OUT</span>
                        <span><i class="sw" style="background:var(--air)"></i> AIR</span>
                    </div>

                    <div class="btn-grid cols-2">
                        <button id="btnSound">เปิดเสียงมอเตอร์</button>
                        <button id="btnPreview" style="background:rgba(255,255,255,0.15)">โหมด 3D หมุนอิสระ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 3D SCENE ==================== -->
    <a-scene vr-mode-ui="enabled: false" loading-screen="enabled: false"
        renderer="antialias: true; colorManagement: true; alpha: true; precision: medium" embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false; patternRatio: 0.5;">

        <a-entity light="type: hemisphere; color: #eaf4ff; groundColor: #2b3740; intensity: 1.0"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.7" position="1.6 2.6 2.0"></a-entity>
        <a-entity light="type: directional; color: #9ad8ff; intensity: 0.3" position="-1.8 1.4 -1.6"></a-entity>

        <a-marker id="markerRoot" preset="hiro" smooth="true" smoothCount="8" smoothTolerance="0.012"
            smoothThreshold="4"></a-marker>

        <a-entity camera cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: [data-part], [data-act]; interval: 120">
            <a-entity id="previewRoot" position="0.15 0.15 -3.4"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        window.VFD = { target: 50, freq: 0, poles: 4, ramp: 5, running: true, fault: null, heat: 0, flow: true };

            $('#btnMore').onclick = () => { $('#more').classList.toggle('show'); $('#btnMore').classList.toggle('on'); };
            $('#btnFlow').onclick = () => { VFD.flow = !VFD.flow; $('#btnFlow').classList.toggle('on', VFD.flow); };

            function setRunning(on) { if (on && VFD.fault) return; VFD.running = on; $('#btnRun').classList.toggle('on', on); buzz(on ? 18 : 12); }
            $('#btnRun').onclick = () => setRunning(true);
            $('#btnStop').onclick = () => setRunning(false);

            function trigFault(key) {
                const f = FAULTS[key]; VFD.fault = key; VFD.running = false;
                $('#btnRun').classList.remove('on'); $('#meter').classList.add('fault');
                $('#faultmsg').innerHTML =
                    `<div class="fault-head"><b>${f.code}</b><span>${f.n}</span></div>` +
                    `<div class="fault-body">${f.d}</div>` +
                    `<button id="btnToastReset">รับทราบและรีเซ็ต</button>`;
                $('#faultbar').classList.add('show');
                if (key === 'oH') VFD.heat = 1;
                highlight([f.part], '#ef4444'); setAutoplay(false); buzz([40, 60, 40]);
                $('#btnToastReset').onclick = () => { clearFault(); setRunning(true); };
            }
            function clearFault() { VFD.fault = null; $('#meter').classList.remove('fault'); $('#faultbar').classList.remove('show'); applyStep(); }
            document.querySelectorAll('[data-fault]').forEach(b => b.onclick = () => trigFault(b.dataset.fault));

            $('#freq').addEventListener('input', e => { VFD.target = +e.target.value; $('#freqval').textContent = VFD.target.toFixed(1) + ' Hz'; });
            $('#accel').addEventListener('input', e => { VFD.ramp = +e.target.value; $('#accelval').textContent = VFD.ramp.toFixed(1) + ' s'; });
            function applySize(v) { userScale = v; const m = $('#modelRoot'); if (m) m.setAttribute('scale', `${v} ${v} ${v}`); $('#sizeval').textContent = (+v).toFixed(2) + '×'; }
            $('#size').addEventListener('input', e => applySize(+e.target.value));

            function applyCutaway() { const s = $('#shellFront'); if (s) s.setAttribute('material', 'opacity', cutaway ? 0.1 : 0.95); }
            $('#btnCut').onclick = () => { cutaway = !cutaway; $('#btnCut').classList.toggle('on', cutaway); $('#btnCut').textContent = cutaway ? 'เปิดฝาดู' : 'ปิดฝาเครื่อง'; applyCutaway(); };
            function applyExplode() { document.querySelectorAll('[data-explode]').forEach(el => { if (!el.dataset.base) { const p = el.getAttribute('position') || { x: 0, y: 0, z: 0 }; el.dataset.base = `${p.x} ${p.y} ${p.z}`; } const b = el.dataset.base.split(' ').map(Number); const o = el.dataset.explode.split(' ').map(Number); const to = exploded ? `${b[0] + o[0]} ${b[1] + o[1]} ${b[2] + o[2]}` : el.dataset.base; el.setAttribute('animation__ex', { property: 'position', to, dur: 650, easing: 'easeOutCubic' }); }); }
            $('#btnExp').onclick = () => { exploded = !exploded; $('#btnExp').classList.toggle('on', exploded); applyExplode(); buzz(15); };

            const detail = $('#detail');
            function showDetail(key) { const p = PARTS[key]; if (!p) return; $('#detailTitle').textContent = p.n; $('#detailBody').textContent = p.d; detail.classList.add('show'); setAutoplay(false); if (typeof p.s === 'number') { step = p.s; applyStep(); } highlight([key], '#38bdf8'); buzz(20); }
            function hideDetail() { detail.classList.remove('show'); applyStep(); }
            $('#detailClose').onclick = hideDetail;
            detail.addEventListener('click', e => { if (e.target === detail) hideDetail(); });   // แตะพื้นหลังเพื่อปิด

            document.querySelector('a-scene').addEventListener('click', evt => {
                const el = evt.target;
                if (!el || !el.closest) return;
                const act = el.closest('[data-act]');
                if (act) { if (act.dataset.act === 'run' && VFD.fault) clearFault(); setRunning(act.dataset.act === 'run'); return; }
                const part = el.closest('[data-part]');
                if (part) showDetail(part.dataset.part);
            });

            let audio = null;
            function initAudio() { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; const ctx = new AC(); const gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination); const hum = ctx.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 100; const whine = ctx.createOscillator(); whine.type = 'triangle'; whine.frequency.value = 1400; const wGain = ctx.createGain(); wGain.gain.value = 0.35; hum.connect(gain); whine.connect(wGain); wGain.connect(gain); hum.start(); whine.start(); return { ctx, gain, hum, whine }; }
            $('#btnSound').onclick = () => {
                if (!audio) audio = initAudio();
                if (!audio) return;
                if (audio.ctx.state === 'suspended') audio.ctx.resume();
                audio.on = !audio.on;
                $('#btnSound').classList.toggle('on', !!audio.on);
                $('#btnSound').textContent = audio.on ? 'ปิดเสียงมอเตอร์' : 'เปิดเสียงมอเตอร์';
            };

            (function gestures() {
                let dragging = false, lastX = 0, pinch0 = 0, scale0 = 0.6;
                const canvasOK = e => mounted === 'preview' && e.target && e.target.tagName === 'CANVAS';
                const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
                document.addEventListener('touchstart', e => { if (!canvasOK(e)) return; if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; } if (e.touches.length === 2) { pinch0 = dist(e.touches); scale0 = userScale || 0.6; } }, { passive: true });
                document.addEventListener('touchmove', e => { if (!canvasOK(e)) return; const m = $('#modelRoot'); if (!m) return; if (e.touches.length === 1 && dragging) { if (faceCam) { faceCam = false; $('#btnFace').classList.remove('on'); m.setAttribute('face-cam', 'enabled', false); } userYaw += (e.touches[0].clientX - lastX) * 0.5; lastX = e.touches[0].clientX; m.setAttribute('rotation', `0 ${userYaw} 0`); } else if (e.touches.length === 2 && pinch0) { const v = Math.max(0.25, Math.min(1.4, scale0 * dist(e.touches) / pinch0)); applySize(v); $('#size').value = v; } }, { passive: true });
                document.addEventListener('touchend', () => { dragging = false; pinch0 = 0; }, { passive: true });
            })();

            $('#btnPreview').onclick = () => {
                const to = mounted === 'marker' ? 'preview' : 'marker';
                mount(to);
                $('#btnPreview').textContent = to === 'preview' ? 'กลับไปใช้ AR Marker' : 'โหมด 3D หมุนอิสระ';
                setStatus(to === 'preview' ? 'preview' : 'searching');
            };
            function setStatus(mode) { $('#status-pill').classList.toggle('found', mode === 'found' || mode === 'preview'); $('#statustext').textContent = mode === 'found' ? 'พบ Marker แล้ว' : mode === 'preview' ? 'โหมดจำลอง 3D' : 'ค้นหา Marker…'; }

            const marker = $('#markerRoot');
            marker.addEventListener('markerFound', () => { if (mounted === 'marker') { setStatus('found'); buzz(25); } });
            marker.addEventListener('markerLost', () => { if (mounted === 'marker') setStatus('searching'); });

            let last = performance.now(), lastRpm = -1;
            function loop(now) {
                const dt = Math.min(0.1, (now - last) / 1000); last = now;
                const rate = 50 / Math.max(0.5, VFD.ramp);
                if (VFD.fault) { VFD.freq = Math.max(0, VFD.freq - rate * 1.6 * dt); }
                else if (VFD.running) { const d = VFD.target - VFD.freq; VFD.freq += Math.sign(d) * Math.min(Math.abs(d), rate * dt); }
                else { VFD.freq = Math.max(0, VFD.freq - rate * dt); }

                const load = VFD.freq / 50;
                if (VFD.fault !== 'oH') { VFD.heat += (load * 0.85 - VFD.heat) * dt * 0.25; VFD.heat = Math.max(0, Math.min(1, VFD.heat)); }

                const rpm = Math.round(120 * VFD.freq / VFD.poles);
                $('#mFreq').textContent = VFD.fault ? FAULTS[VFD.fault].code : VFD.freq.toFixed(2);
                $('#mRpm').textContent = rpm;
                $('#mState').textContent = VFD.fault ? 'FAULT' : VFD.running ? (Math.abs(VFD.target - VFD.freq) > 0.2 ? 'ACC' : 'RUN') : 'STOP';
                $('#heatfill').style.width = (VFD.heat * 100).toFixed(0) + '%';

                const kp = document.getElementById('kpDisplay');
                if (kp) { const txt = VFD.fault ? (Math.floor(now / 450) % 2 ? FAULTS[VFD.fault].code : ' ') : VFD.freq.toFixed(2); if (kp.dataset.last !== txt) { kp.dataset.last = txt; kp.setAttribute('th-label', 'text', txt); } }

                const ml = document.getElementById('motorLabel');
                if (ml && rpm !== lastRpm) { lastRpm = rpm; ml.setAttribute('th-label', 'text', `มอเตอร์เหนี่ยวนำ 4 ขั้ว|${rpm} rpm`); }

                if (audio) { const g = audio.on && VFD.freq > 0.3 ? 0.035 : 0; audio.gain.gain.setTargetAtTime(g, audio.ctx.currentTime, 0.08); audio.hum.frequency.setTargetAtTime(24 + VFD.freq * 2.4, audio.ctx.currentTime, 0.08); audio.whine.frequency.setTargetAtTime(700 + VFD.freq * 26, audio.ctx.currentTime, 0.08); }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);

            /* ย้ายวิดีโอกล้องขึ้นมาเป็นลูกตัวแรกของ body และตรึงสไตล์ด้วย JS
               เพราะ AR.js ตั้งชื่อ element ไม่แน่นอนในแต่ละเวอร์ชัน */
            let videoTries = 0;
            function fixVideo() {
                const v = document.querySelector('video');
                if (v) {
                    Object.assign(v.style, {
                        position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
                        objectFit: 'cover', zIndex: '0', display: 'block', opacity: '1', visibility: 'visible'
                    });
                    if (document.body.firstChild !== v) document.body.insertBefore(v, document.body.firstChild);
                    return;
                }
                if (++videoTries < 40) setTimeout(fixVideo, 250);   // ลองซ้ำได้ราว 10 วินาที
            }
            fixVideo();
            window.addEventListener('resize', () => setTimeout(fixVideo, 120));
            window.addEventListener('orientationchange', () => setTimeout(fixVideo, 350));
            [600, 1500, 3000, 6000].forEach(t => setTimeout(fixVideo, t));

            const scene = document.querySelector('a-scene'); let started = false;
            function start() { if (started) return; started = true; $('#loader').style.display = 'none'; mount('marker'); setAutoplay(true); fixVideo(); }
            if (scene.hasLoaded) start();
            scene.addEventListener('loaded', start);
            scene.addEventListener('renderstart', start);
            setTimeout(start, 2500);

            function showErr(msg) { const b = $('#errbar'); b.style.display = 'block'; b.textContent = String(msg).slice(0, 400); }
            window.addEventListener('error', e => { if (e.target && e.target.tagName === 'SCRIPT') showErr('โหลดสคริปต์ไม่สำเร็จ: ' + e.target.src); else showErr(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); }, true);
            window.addEventListener('unhandledrejection', e => showErr('Promise: ' + (e.reason && e.reason.message || e.reason)));
            window.addEventListener('camera-error', () => showErr('เปิดกล้องไม่สำเร็จ ตรวจสิทธิ์กล้องของเว็บไซต์นี้'));
        })();
    </script>
</body>

</html>
